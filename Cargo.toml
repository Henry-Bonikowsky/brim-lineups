[package]
name = "brim-lineups"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["native"]
native = ["dep:rayon", "dep:tiny_http", "dep:flate2", "rayon"]
rayon = ["dep:rayon"]

[dependencies]
parry3d = "0.17"
nalgebra = "0.33"
serde_json = "1"
rayon = { version = "1.10", optional = true }
tiny_http = { version = "0.12", optional = true }
flate2 = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = 3
