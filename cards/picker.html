<!doctype html><meta charset="utf-8"><title>Target picker</title>
<style>
body { background:#14181c; color:#dde; font:14px/1.5 system-ui; margin:20px }
select { font-size:16px; padding:4px } .wrap { position:relative; display:inline-block; margin-top:12px }
img { width:768px; cursor:crosshair } #out { margin-top:10px; font-family:consolas,monospace; background:#0a0d10; padding:10px; border-radius:6px }
#dot { position:absolute; width:12px; height:12px; border:2px solid #ffd166; border-radius:50%; transform:translate(-50%,-50%); display:none; pointer-events:none }
#dot2 { position:absolute; width:12px; height:12px; border:2px solid #6f6; border-radius:50%; transform:translate(-50%,-50%); display:none; pointer-events:none }
</style>
<h1>Pick a molly lineup</h1>
<p><b>Left-click</b> = landing spot (yellow). <b>Right-click</b> = standing spot (green, optional).
With both set you get the exact lineup for that pair; with only a landing spot you get every
covered lineup to it. Copy the command, or tell Claude the numbers.</p>
<select id="map"></select>
<div class="wrap"><img id="img"><div id="dot"></div><div id="dot2"></div></div>
<div id="out">click the map...</div>
<div id="results"></div>
<script>
const cams = { "Plummet": { "cx": 6375, "yaw": 0, "ortho": 13312, "cy": 6025 }, "Juliett": { "cx": 200, "yaw": 0, "ortho": 12800, "cy": 0 }, "Rook": { "cx": 0.004757, "yaw": 1033.3136, "ortho": 14336, "cy": -375 }, "Ascent": { "cx": 1050, "yaw": 0, "ortho": 14336, "cy": -4500 }, "Jam": { "cx": 5775, "yaw": 0, "ortho": 13824, "cy": 624.9979 }, "Foxtrot": { "cx": 4775, "yaw": 0, "ortho": 14336, "cy": 500 }, "Duality": { "cx": 7900, "yaw": 0, "ortho": 16896, "cy": -1300 }, "Pitt": { "cx": 5325, "yaw": 0, "ortho": 12800, "cy": 250 }, "Infinity": { "cx": 0, "yaw": 0, "ortho": 12400, "cy": 0 }, "Triad": { "cx": 1900, "yaw": 0, "ortho": 13312, "cy": -7900 }, "Bonsai": { "cx": 2529, "yaw": 0, "ortho": 12800, "cy": -4380 }, "Canyon": { "cx": 8395.34, "yaw": 0, "ortho": 12800, "cy": -728.98 }, "Port": { "cx": -2700, "yaw": 0, "ortho": 13824, "cy": 550 } } ;
const NAMES = { Triad: 'Haven', Bonsai: 'Split', Canyon: 'Fracture', Duality: 'Bind', Foxtrot: 'Breeze', Infinity: 'Abyss', Jam: 'Lotus', Juliett: 'Sunset', Pitt: 'Pearl', Port: 'Icebox', Rook: 'Corrode', Plummet: 'Summit', Ascent: 'Ascent' };
{ const j = cams;
  const sel = document.getElementById('map');
  Object.keys(j).sort((a, b) => (NAMES[a] || a).localeCompare(NAMES[b] || b)).forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = NAMES[m] || m; sel.appendChild(o); });
  sel.onchange = () => { document.getElementById('img').src = sel.value + '.png'; document.getElementById('dot').style.display = 'none'; };
  sel.onchange();
}
let targetPt = null, standPt = null;
function toWorld(e) {
  const m = document.getElementById('map').value, c = cams[m];
  const r = e.target.getBoundingClientRect();
  const u = (e.clientX - r.left) / r.width, v = (e.clientY - r.top) / r.height;
  const th = (c.yaw || 0) * Math.PI / 180;
  const ux = Math.cos(th), uy = Math.sin(th);      // image-up axis in world
  const rx = -uy, ry = ux;                          // image-right axis
  const du = (u - 0.5) * c.ortho, dv = (0.5 - v) * c.ortho;
  return { X: c.cx + rx * du + ux * dv, Y: c.cy + ry * du + uy * dv, u, v };
}
const isLive = location.protocol.startsWith('http');
async function refresh() {
  const m = document.getElementById('map').value;
  let txt = '';
  if (targetPt) txt += `land at:  ${targetPt.X.toFixed(0)}, ${targetPt.Y.toFixed(0)}\n`;
  if (standPt) txt += `stand at: ${standPt.X.toFixed(0)}, ${standPt.Y.toFixed(0)}\n`;
  if (targetPt && !isLive) {
    txt += `\n.\\target\\release\\brim-lineups.exe "..\\ValoBoard\\third_party\\valorant_dump\\${m}" --target "${targetPt.X.toFixed(0)},${targetPt.Y.toFixed(0)},auto"`;
    if (standPt) txt += ` --stand "${standPt.X.toFixed(0)},${standPt.Y.toFixed(0)},auto" --tol 250`;
    txt += ` --render .\\out --top 5`;
    txt += `\n(run the server for click-to-solve: brim-lineups serve)`;
  }
  document.getElementById('out').textContent = txt || 'click the map...';
  if (targetPt && isLive) solveNow(m);
}
let solving = false;
async function solveNow(m) {
  if (solving) return;
  solving = true;
  const res = document.getElementById('results');
  res.innerHTML = '<p>solving' + (standPt ? ' (paired)' : '') + '... first click on a map loads it (~20s), later clicks are fast</p>';
  let q = `/solve?map=${m}&tx=${targetPt.X.toFixed(0)}&ty=${targetPt.Y.toFixed(0)}`;
  if (standPt) q += `&sx=${standPt.X.toFixed(0)}&sy=${standPt.Y.toFixed(0)}`;
  try {
    const j = await (await fetch(q)).json();
    if (j.error) { res.innerHTML = `<p>${j.error}</p>`; solving = false; return; }
    let h = `<p>${j.count} working lineups to (${j.target.join(', ')}) - top ${j.lineups.length}:</p>`;
    j.lineups.forEach((l, i) => {
      const aim = l.aim_ref ? `crosshair lands on geometry ${(l.aim_ref[3] / 100).toFixed(1)}m ahead` : 'crosshair: open sky (use the ability-bar alignment in the aim image)';
      const m = v => (v / 100).toFixed(1) + 'm';
      const verdict = l.covered
        ? `<span style='color:#7f7'>fire covers your spot</span> (rests ${m(l.err)} away)`
        : l.err <= 450
          ? `<span style='color:#fa6'>lands close (${m(l.err)}) but the fire is BLOCKED - it spreads on the wrong side of geometry</span>`
          : `<span style='color:#fa6'>fire does NOT reach - closest possible rests ${m(l.err)} away</span>`;
      const pos = l.pos === 2
        ? `<span style='color:#7f7'>easy position - rough standing is fine</span>`
        : l.pos === 1
          ? `<span style='color:#ad7'>anchored - back into the object shown in the top-down view</span>`
          : `<span style='color:#fa6'>loose position - standing spot matters and nothing to anchor on</span>`;
      h += `<h3>#${i + 1}: ${verdict}. ${pos}. range ${m(l.range)}, ${l.time}s flight, ${l.bounces} bounces. ${aim}. stand (${l.stand.join(', ')})</h3>`;
      h += l.imgs.map(im => `<img src='${im}' style='width:420px;margin:2px'>`).join('');
      h += `<div id='vid${i + 1}'><button onclick='flightVideo(${i + 1})'>flight video</button></div>`;
    });
    res.innerHTML = h;
    flightVideo(1); // auto for the best lineup
  } catch (e) {
    res.innerHTML = `<p>solve failed: ${e}</p>`;
  }
  solving = false;
}
async function flightVideo(n) {
  const m = document.getElementById('map').value;
  const slot = document.getElementById('vid' + n);
  if (!slot || !targetPt) return;
  slot.innerHTML = 'rendering flight video (~20s)...';
  let q = `/video?map=${m}&tx=${targetPt.X.toFixed(0)}&ty=${targetPt.Y.toFixed(0)}&n=${n}`;
  if (standPt) q += `&sx=${standPt.X.toFixed(0)}&sy=${standPt.Y.toFixed(0)}`;
  try {
    const j = await (await fetch(q)).json();
    slot.innerHTML = j.video
      ? `<video autoplay loop muted playsinline controls src='${j.video}' style='width:640px;margin:4px 0'></video>`
      : (j.error || 'failed');
  } catch (e) { slot.innerHTML = 'video failed: ' + e; }
}
const img = document.getElementById('img');
img.onclick = e => {
  targetPt = toWorld(e);
  const d = document.getElementById('dot');
  d.style.left = (targetPt.u * 100) + '%'; d.style.top = (targetPt.v * 100) + '%'; d.style.display = 'block';
  refresh();
};
img.oncontextmenu = e => {
  e.preventDefault();
  standPt = toWorld(e);
  const d = document.getElementById('dot2');
  d.style.left = (standPt.u * 100) + '%'; d.style.top = (standPt.v * 100) + '%'; d.style.display = 'block';
  refresh();
};
</script>
